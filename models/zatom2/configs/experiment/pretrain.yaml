# @package _global_
# Training configuration for Zatom-2

defaults:
  - /datasets/train/omol25/omol25@datasets.train.omol25
  - /datasets/train/omat24/omat24@datasets.train.omat24
  - _self_

name: pretrain-omol25-omat24-joint
tags: [pretrain, omol25, omat24, unconditional, structure-prediction]
ckpt_path: null

datasets:
  diffusion_batch_size_train: 16
  crop_size: 256
  max_atoms_in_crop: 2560  # ~10x crop size.
  global_transform_args:
    train_conditions:
      unconditional:
        frequency: 1.0
      island:
        frequency: 0.0
      sequence_design:
        frequency: 0.0
      structure_prediction:
        frequency: 1.0
    # OMol25 and OMat24 contain atomized molecule/material examples only. Disable
    # protein-context feature work that is inapplicable to these datasets.
    meta_conditioning_probabilities:
      calculate_hbonds: 0.0
      calculate_rasa: 0.0
      keep_protein_motif_rasa: 0.0
      hbond_subsample: 0.0
      unindex_leak_global_index: 0.0
      unindex_insert_random_break: 0.0
      unindex_remove_random_break: 0.0
      add_1d_ss_features: 0.0
      featurize_plddt: 0.0
      add_global_is_non_loopy_feature: 0.0
      add_ppi_hotspots: 0.0
      full_binder_crop: 0.0
  train:
    omol25:
      probability: 0.5
      dataset:
        transform:
          optimize_atomized_ligand_pipeline: true
    omat24:
      probability: 0.5
      dataset:
        transform:
          optimize_atomized_ligand_pipeline: true
    pdb: null
