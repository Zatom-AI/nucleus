# @package _global_
# Figure 1: base Zatom-2 on fixed 500k OMol25 + 500k OMat24 subsets.

defaults:
  - paper-table3-joint-properties-force-conditioned
  - _self_

name: paper-figure1-zatom2-omol25-500k-omat24-500k-joint-properties-force-conditioned
tags: [paper, figure-1, scaling, pretrain, zatom2, omol25-500k, omat24-500k, joint-properties, force-conditioned]

datasets:
  train:
    omol25:
      uniform_subset_size: 500000
      uniform_subset_seed: 42
      uniform_subset_source_size: 3986754
      uniform_subset_expected_sha256: 36b7366932ae1dbe3941743373610a063018697a2f2cd16664efbca114bdf01e
    omat24:
      uniform_subset_size: 500000
      uniform_subset_seed: 42
      uniform_subset_source_size: 1009850
      uniform_subset_expected_sha256: 73d46f5304147e419a81c6df15f9a0fa628c199a525566637bf2b6fc887a5227

trainer:
  max_epochs: 40
  # Preserve the full-data per-epoch example budget while restricting
  # the support of each domain sampler to its fixed 500k-example subset.
  n_examples_per_epoch: 4996604
  # Retain the existing generation/structure validation cadence.
  validate_loader_every_n_epochs:
    omol25_generation: 19
    omat24_generation: 19
    omol25_structure_prediction: 19
    omat24_structure_prediction: 19
