# @package _global_

defaults:
  - inference_engine: zatom2
  - _self_

ckpt_path: ???
out_dir: ???

# The manifests are generated by the prepare stage and assigned at runtime.
inputs: null
n_batches: 1
num_nodes: 1
devices_per_node: 1
# Each input specification represents up to eight independently noised outputs
# with the same pre-sampled atom count. Tail replicas are generated but excluded
# by the frozen per-count grouping plan, preserving exactly 10,000/2,500 scores.
diffusion_batch_size: 8
global_prefix: ""
json_keys_subset: null
skip_existing: false
save_cifs: true
save_molecules: false
dump_prediction_metadata_json: true
output_full_json: true
dump_trajectories: false
prevalidate_inputs: true
low_memory_mode: false
use_ema_weights: true
seed: 42

# Freeze the sampler stored in the Table-2 training checkpoint.  The generic
# design config uses different 200-step / gamma_0=0.6 inference defaults.
inference_sampler:
  kind: default
  solver: af3
  num_timesteps: 100
  min_t: 0
  max_t: 1
  sigma_data: 16
  s_min: 4e-4
  s_max: 160
  p: 7
  gamma_0: 0.8
  gamma_min: 1.0
  noise_scale: 1.003
  step_scale: 1.5
  fraction_of_steps_to_fix_motif: 0.0
  skip_few_diffusion_steps: false
  allow_realignment: false
  insert_motif_at_end: true
  use_classifier_free_guidance: false
  n_recycle: 2

evaluation:
  stages: all
  protocol_dir: ${out_dir}/protocol
  seed: ${seed}
  overwrite: false
  # Reuse only hash-verified completed groups, structures and oracle results.
  resume: false
  # Per-invocation budget; exit 75 requests another allocation. Null is unlimited.
  walltime_seconds: null
  hash_checkpoint: true
  # Any changed sample count, batching, EMA, or sampler setting is diagnostic,
  # not the manuscript protocol, and requires an explicit opt-out.
  allow_noncanonical_protocol: false

  qm9:
    # Zatom-1 Table 2: OpenBabel/PDB validity, uniqueness, seven PoseBusters checks.
    # Use the Table-2-only chemistry pins in docs/table2_qm9.requirements.txt.
    num_samples: 10000
    training_num_examples: 100000
    training_data_dir: ${oc.env:QM9_DATA_DIR,${oc.env:PROJECT_ROOT,.}/data/qm9/raw/train_100k}

  mp20:
    num_samples: 2500
    training_num_examples: 27138
    training_data_dir: ${oc.env:MP20_DATA_DIR,${oc.env:PROJECT_ROOT,.}/data/mp_20/raw/train_27138}
    # Optional FlowMM-compatible variant; original generated CIFs stay untouched.
    prerelax:
      enabled: false
      runner_command: ["${oc.env:ZEVALS_CHGNET_PYTHON,python}"]
      fmax: 0.1
      steps: 1500
      relax_cell: true
      device: cuda
      seed: ${evaluation.seed}
    lematgenbench:
      repo_path: ${oc.env:ZEVALS_LEMAT_GENBENCH_REPO,null}
      run_name: zatom2-table2
      config_name: comprehensive_multi_mlip_hull
      families: [distribution, diversity, novelty, uniqueness, stability, sun]
      fingerprint_method: structure-matcher
      runner_command: [uv, run, --frozen, python]
      expected_commit: 58e6eae3e4a6c87c22171cf069123ecc4e2fa7e6
      expected_lock_sha256: 74970323f6697d50e60251de9182e7a559031bce67ab2f693986742e7c286850
      verify_mace_checkpoint: true
      expected_mace_checkpoint_sha256: 75428afe3a1d7d8062e19bcaabd5c433623cabf308242ec9fb493e38604fb638
      verify_orb_checkpoint: true
      expected_orb_checkpoint_sha256: 0a41ef1132ad9c41ee0c7b9d855fccabfefb97abe04625c97ec0d07930b6c0f0
      verify_uma_checkpoint: true
      expected_uma_checkpoint_sha256: 02f83e20547294d3d47dd9dfbe4a4ee51eebca21b2e1febe63210e55b764cc78
      enforce_reference_revisions: true
      # The pinned runner otherwise changes backend based on host visibility.
      # Preserve the scheduler mask, verify CUDA is usable, and archive the
      # isolated Python/Torch/CUDA/GPU runtime in the adapter manifest.
      runtime_device: cuda
      cuda_visible_devices: null
      parse_failures_as_invalid: true
      require_complete_oracle_coverage: true
      require_clean_repo: true
      timeout_seconds: null
      fail_on_family_error: true
      reuse_raw_results: false
      # Latest LeMat has no scalar aggregate for either family. These explicit
      # choices form the compact manuscript projection; every component is
      # retained in mp20/metrics.json.
      distribution_key: distribution/JSDistance
      diversity_key: diversity/element_diversity
