name: omat24_structure_prediction
domain: omat24
task: structure_prediction
inputs: ${oc.env:PROJECT_ROOT}/models/zatom2/docs/examples/omat24_val_structure_prediction_500.json
# One candidate for each of 500 targets gives 500 saved samples.
n_batches: 1

reference_fingerprint_path: null
reference_fingerprints_path: ${oc.env:PROJECT_ROOT}/data/omat24/subsets/train_1M_fingerprints.npy

afd:
  reference: mp20
  model_name: Ty-Perez/ct-scd-amp20

structure_prediction:
  enabled: true
  top_k: [1]
