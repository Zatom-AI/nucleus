# https://wandb.ai

wandb:
  _target_: wandb.integration.lightning.fabric.WandbLogger
  save_dir: ${paths.output_dir}
  name: ${name}
  offline: False
  id: null # pass correct id (along with checkpoint path, and resume='allow' or 'must') to resume a run
  anonymous: null # enable anonymous logging
  project: ${project}
  entity: "zatom"
  prefix: "" # a string to put at the beginning of metric keys
  log_model: False # do not upload model checkpoints
  tags: ${tags}
  # (Default resume to "allow" to resume runs if the run id is provided. If you want to always start a new run, set resume to "never". If you want to always resume a run, set resume to "must".)
  resume: allow # never, allow, or must (see: https://docs.wandb.ai/guides/runs/resuming/)
